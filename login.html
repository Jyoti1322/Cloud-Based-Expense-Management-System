<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Cloud Expense Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #4facfe, #00f2fe);
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .card {
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px;
      width: 380px;
      color: #fff;
    }
    input { border-radius: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="text-center mb-4">Login</h2>
    <form action="welcome.html" method="get">
      <div class="mb-3">
        <input type="email" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-light w-100">Login</button>
    </form>
    <p class="text-center mt-3">
      No account? <a href="register.html" class="text-light">Register</a><br>
      <a href="index.html" class="text-light">Back to Home</a>
    </p>
  </div>
</body>
</html>
