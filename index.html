<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloud Expense Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1556742400-b5d0d993f9c5') no-repeat center/cover;
      font-family: 'Montserrat', sans-serif;
      height: 100vh;
      color: white;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .overlay {
      background: rgba(0,0,0,0.6);
      position: absolute; top:0; left:0; width:100%; height:100%;
    }
    .content {
      z-index: 2;
    }
    .btn-custom {
      border-radius: 25px;
      padding: 12px 30px;
      margin: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="overlay"></div>
  <div class="content">
    <h1 class="mb-3">Cloud-Based Expense Management System</h1>
    <p class="lead mb-4">Smart, secure, and scalable way to manage your expenses in the cloud</p>
    <a href="login.html" class="btn btn-light btn-custom">Login</a>
    <a href="register.html" class="btn btn-outline-light btn-custom">Register</a>
  </div>
</body>
</html>
