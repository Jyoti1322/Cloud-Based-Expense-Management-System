<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - Cloud Expense Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #11998e, #38ef7d);
      display: flex; align-items: center; justify-content: center; height: 100vh;
    }
    .form-box {
      background: #fff;
      border-radius: 15px;
      padding: 35px;
      width: 420px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="form-box">
    <h2 class="text-center mb-4">Create Account</h2>
    <form action="welcome.html" method="get">
      <div class="mb-3"><input type="text" class="form-control" placeholder="Full Name" required></div>
      <div class="mb-3"><input type="email" class="form-control" placeholder="Email" required></div>
      <div class="mb-3"><input type="password" class="form-control" placeholder="Password" required></div>
      <div class="mb-3"><input type="password" class="form-control" placeholder="Confirm Password" required></div>
      <button class="btn btn-success w-100">Register</button>
    </form>
    <p class="text-center mt-3">
      Already have an account? <a href="login.html">Login</a><br>
      <a href="index.html">Back to Home</a>
    </p>
  </div>
</body>
</html>
